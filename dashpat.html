<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Patient | Cabinet Dr Amari</title>

    <link rel="stylesheet" href="dashpat.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logocard.jpg">
</head>
<body>

<header>
    <div class="container">
        <h2>Cabinet Dr Amari</h2>
        <a href="login.html" class="logout">Déconnexion</a>
    </div>
</header>

<div class="container">

    <div class="welcome-box">
        <h1 id="welcome"></h1>
        <br>Bienvenue dans votre espace patient sécurisé
    </div>

    <div class="card">
        <h2>Poser une question au Dr Amari</h2>

        <form id="questionForm">
            <label>Sujet</label>
            <input type="text" id="subject" placeholder="Ex : Douleurs thoraciques" required>

            <label>Votre question</label>
            <textarea id="question" rows="5" placeholder="Décrivez vos symptômes, leur durée, et les traitements en cours (nom du médicament et dosage si possible)" required></textarea>

            <button type="submit">Envoyer la demande</button>
        </form>

        <p id="message"></p>
    </div>

    <div class="card">
        <h2>Mes demandes</h2>
        <div id="questionsList"></div>
    </div>

</div>

<div id="popup" class="popup hidden">
    <div class="popup-content">
        <h3>✔ Succès</h3>
        <p id="popupMessage">Votre demande a été envoyée avec succès.</p>
        <button id="closePopupBtn">OK</button> </div>
</div>

<script src="dashpat.js"></script>

</body>
</html>
